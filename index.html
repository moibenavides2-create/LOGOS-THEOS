<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGOS-THEOS · Escuela de Investigación Teológica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#FAFAFA;
    --superficie:#FFFFFF;
    --tinta:#17171B;
    --tinta-suave:#6B7078;
    --borde:#E7E7EC;
    --rojo-logos:#DC2626;
    --azul-theos:#2453D6;
    --oro-pacto:#D97706;
    --sombra:rgba(15,15,25,0.07);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--fondo);
    color:var(--tinta);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:'Inter', sans-serif;
    letter-spacing:-0.02em;
    font-weight:800;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- HEADER ---------- */
  header{
    padding:52px 24px 34px;
    text-align:center;
    max-width:900px;
    margin:0 auto;
    opacity:0;
    animation:aparecer 0.5s ease-out forwards;
  }
  @keyframes aparecer{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    header{animation:none; opacity:1;}
  }

  .logo-img{
    width:132px;
    height:auto;
    margin:0 auto 14px;
    display:block;
  }
  .sr-solo{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  header p.tagline{
    margin:0 0 22px;
    font-size:0.95rem;
    color:var(--tinta-suave);
    font-weight:500;
  }

  .marca-cruz{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  .marca-cruz span{
    width:16px;height:3px;
    border-radius:2px;
  }
  .marca-cruz span:nth-child(1){background:var(--rojo-logos);}
  .marca-cruz span:nth-child(2){background:var(--tinta-suave); opacity:0.3; width:5px;}
  .marca-cruz span:nth-child(3){background:var(--azul-theos);}

  /* ---------- LAYOUT ---------- */
  main{max-width:880px;margin:0 auto;padding:10px 24px 110px;}

  #vista-inicio .intro{
    text-align:center;
    max-width:560px;
    margin:0 auto 40px;
    color:var(--tinta-suave);
    font-size:1rem;
    line-height:1.6;
  }

  .rejilla-temas{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
  }

  .tarjeta-tema{
    position:relative;
    background:var(--superficie);
    border:1px solid var(--borde);
    border-radius:16px;
    padding:26px 22px;
    text-align:left;
    cursor:pointer;
    overflow:hidden;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .tarjeta-tema::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
  }
  .tarjeta-tema.acento-rojo::before{background:var(--rojo-logos);}
  .tarjeta-tema.acento-azul::before{background:var(--azul-theos);}

  .tarjeta-tema:hover, .tarjeta-tema:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 16px 32px var(--sombra);
    outline:none;
  }
  .tarjeta-tema h3{
    margin:0 0 8px;
    font-size:1.2rem;
    line-height:1.3;
  }
  .tarjeta-tema .conteo{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    font-weight:600;
  }

  /* ---------- VISTA DE TEMA ---------- */
  #vista-tema{display:none;}
  .btn-volver{
    background:none;
    border:none;
    color:var(--tinta-suave);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    padding:0;
    margin-bottom:26px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:600;
  }
  .btn-volver:hover{color:var(--tinta);}

  .encabezado-tema h2{
    font-size:clamp(1.5rem, 4vw, 2rem);
    margin:0 0 28px;
  }

  .clase{
    background:var(--superficie);
    border:1px solid var(--borde);
    border-radius:14px;
    margin-bottom:10px;
    overflow:hidden;
  }

  .clase-cabecera{
    width:100%;
    background:none;
    border:none;
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    text-align:left;
    cursor:pointer;
  }

  .punto-tipo{
    width:10px;height:10px;
    border-radius:50%;
    flex-shrink:0;
  }
  .punto-tipo.lectura{background:var(--azul-theos);}
  .punto-tipo.libreta{background:var(--rojo-logos);}
  .punto-tipo.compromiso{background:var(--oro-pacto);}

  .clase-cabecera .info-clase{flex:1; min-width:0;}
  .clase-cabecera h3{
    margin:0 0 3px;
    font-size:1.02rem;
    font-weight:600;
  }
  .clase-cabecera .etiqueta-tipo{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-weight:600;
  }
  .clase-cabecera .etiqueta-tipo.lectura{color:var(--azul-theos);}
  .clase-cabecera .etiqueta-tipo.libreta{color:var(--rojo-logos);}
  .clase-cabecera .etiqueta-tipo.compromiso{color:var(--oro-pacto);}

  .clase-cabecera .flecha{
    font-family:'IBM Plex Mono', monospace;
    color:var(--tinta-suave);
    transition:transform 0.2s ease;
    flex-shrink:0;
  }
  .clase.abierta .clase-cabecera .flecha{transform:rotate(90deg);}

  .clase-contenido{
    display:none;
    padding:0 20px 22px 44px;
    color:var(--tinta);
    font-size:0.97rem;
    line-height:1.65;
  }
  .clase.abierta .clase-contenido{display:block;}

  footer{
    text-align:center;
    padding:30px 24px 50px;
    color:var(--tinta-suave);
    font-size:0.8rem;
  }

  @media (max-width:520px){
    .clase-contenido{padding-left:24px;}
  }
</style>
</head>
<body>

<header>
  <img src="logo-logos-theos.png" alt="Logos-Theos" class="logo-img">
  <h1 class="sr-solo">Logos-Theos</h1>
  <p class="tagline">Escuela de Investigación Teológica</p>
  <div class="marca-cruz" aria-hidden="true"><span></span><span></span><span></span></div>
</header>

<main>
  <section id="vista-inicio">
    <p class="intro">Cada tema reúne las clases que se van publicando. Entra a un tema para verlas.</p>
    <div class="rejilla-temas" id="rejilla-temas"></div>
  </section>

  <section id="vista-tema">
    <button class="btn-volver" onclick="volverAInicio()">← Todos los temas</button>
    <div class="encabezado-tema">
      <h2 id="titulo-tema"></h2>
    </div>
    <div id="lista-clases"></div>
  </section>
</main>

<footer>
  Escuela de Investigación Teológica LOGOS-THEOS
</footer>

<script>
/* =========================================================================
   CONTENIDO DE LA ESCUELA
   -------------------------------------------------------------------------
   Cada TEMA tiene varias CLASES. Cada clase lleva:
     - titulo: el nombre de la clase
     - tipo: "lectura", "libreta" o "compromiso" (define el color y la etiqueta)
     - texto: el contenido simple de la clase

   Para publicar una clase nueva, agrega un objeto dentro del arreglo
   "clases" del tema correspondiente. Para crear un tema nuevo, copia uno
   de los bloques de "temas" y cambia el "id" (sin espacios ni tildes) y
   el "titulo".

   Esto de aquí abajo es CONTENIDO DE EJEMPLO para que veas cómo se ve la
   página. Reemplázalo por los temas y clases reales.

   ---------------------------------------------------------------------
   PLANTILLA PARA UNA CLASE NUEVA (copia y pega dentro del arreglo
   "clases" del tema que corresponda, y llena los espacios):

      {
        titulo: "",
        tipo: "lectura", // cambia a "libreta" o "compromiso" si aplica
        texto: ""
      },

   PLANTILLA PARA UN TEMA NUEVO (copia y pega dentro del arreglo
   "temas", al mismo nivel que los demás temas):

      {
        id: "",       // sin espacios ni tildes, ej: "vida-de-jesus"
        titulo: "",
        clases: []
      },
   ---------------------------------------------------------------------
   ========================================================================= */

const etiquetas = {
  lectura: "Solo lectura",
  libreta: "Para tu libreta",
  compromiso: "Compromiso"
};

const temas = [
  {
    id: "SEMINARIO SOBRE LA GRAN COMISIÓN DE JESUCRISTO",
    titulo: "SEMINARIO SOBRE LA GRAN COMISIÓN DE JESUCRISTO",
    clases: [
      {
        titulo: "PRIMERA CLASE",
        tipo: "lectura",
        texto: "Ítem
28(27/5/26)
Edición:
Mayo 26/26

ESCUELA BÍBLICA DE INVESTIGACIÓN TEOLÓGICA LOGOS-THEOS.

Material de solo lectura.

SEMINARIO SOBRE LA GRAN COMISIÓN DE JESUCRISTO
(Primera parte).

INTRODUCCIÓN.

Este seminario es para todos aquellos que obedecen o desean obedecer la Gran Comisión.

La siguiente reflexión es para entender lo necesario para anunciar las Buenas Nuevas de Salvación: 

Iniciaremos haciendo una pregunta teológica:

¿De la siguiente lista quienes merecen morir primero?

¿Los fornicarios, los adúlteros, los homosexuales, los idólatras, los mentirosos, los blasfemos, los avaros, los incrédulos, o los hechiceros?

¿Quiénes de ellos merecerían morir primero?

Piénselo muy bien...

Ahora bien, en base a esa misma lista, responda la siguiente pregunta:

¿Quienes merecerían vivir primero?

Piénselo muy bien...

¿Cuál sería su respuesta?

Imagínese la siguiente escena:

Usted acaba de presenciar un accidente de tránsito y dos hombres agonizan.

Hay llamas a punto de una explosión y solo tiene tiempo y la oportunidad de salvar la vida de uno de los dos hombres gravemente heridos y con llamas a su asedio...

Usted mira y se da cuenta que conoce la identidad de aquellos dos hombres...

Uno de ellos es un padre de familia responsable pero incrédulo, y el otro es un borracho perdido en el alcohol, irresponsable, que golpea a su mujer y a sus hijos.

Usted debe salvar la vida a uno de ellos dos ¿a quién salvaría?

¿Cuál es su posición?

Su decisión determinará su posición...

¿Está usted pensando como un juez o como un salvador?

Ahora piense:
¿A cuál de los dos Dios salvaría?

Recuerde que Dios es Juez Justo y también Salvador...

¿Cuál es la condición delante de Dios de estos dos hombres?

La respuesta es:
¡La misma!

Ambos están perdidos...
Ambos merecen morir...
Ninguno merece vivir...

Ambos necesitan al mismo Salvador...

Moraleja:
El espiritu correcto para obedecer La Gran Comisión es amar a las almas de los pecadores y prever la condenación de todos ellos.

Este es el punto inicial donde queremos empezar.

Si queremos predicar el evangelio, pensemos como un salvador...

Dios quiere salvar a todos los hombres y todos los hombres necesitan al Salvador...

El Gran Juez sabe que mientras el uno es adúltero, el otro es homosexual, y mientras el uno es fornicario, el otro es idólatra.

Mientras el uno es avaro, el otro es maldiciente o blasfemo y mientras uno es mentiroso, el otro es un incrédulo.

Todos los hombres están en la misma condición de pecado delante de Dios.

La biblia dice:

Por cuanto todos pecaron, y están destituidos de la gloria de Dios
Romanos 3(23).

Amando a las almas, Jesucristo subió a la cruz por todos los pecadores:

"No fueron los clavos que sostuvieron a Cristo en la cruz, fue su amor hacia la humanidad perdida".

Su amor benevolente lo condujo a tomar nuestro lugar de condena.

En este seminario no ofreceremos un método exacto, o una estrategia especial para predicar sino la razón de ser de la evangelización y lo esencial de la visión, para realizar la misión.

Te encarezco delante de Dios y del Señor Jesucristo, que juzgará a los vivos y a los muertos en su manifestación y en su reino, que prediques la palabra; que instes a tiempo y fuera de tiempo; redarguye, reprende, exhorta con toda paciencia y doctrina.
2ªTimoteo 4(1-2).

Y si repartiese todos mis bienes para dar de comer a los pobres, y si entregase mi cuerpo para ser quemado, y no tengo amor, de nada me sirve.
1ªCorintios 13(3).

Sigue en la segunda parte."
      },
      {
        titulo: "La autoridad de las Escrituras",
        tipo: "libreta",
        texto: "Anota los cuatro atributos clásicos de las Escrituras vistos en clase: inspiración, autoridad, claridad y suficiencia. Junto a cada uno, escribe una cita bíblica que lo respalde."
      },
      {
        titulo: "Compromiso de la semana",
        tipo: "compromiso",
        texto: "Memorizar 2 Timoteo 3:16-17 y compartir con un compañero de clase lo que aprendiste esta semana sobre la autoridad de la Palabra."
      }
    ]
  },
  {
    id: "bosquejo-de-romanos",
    titulo: "Bosquejo de Romanos",
    clases: [
      {
        titulo: "Introducción y saludo (Romanos 1:1-17)",
        tipo: "lectura",
        texto: "Pablo escribe a una iglesia que no fundó, presentándose como siervo y apóstol. En estos versículos queda planteado el tema central de toda la carta: el evangelio como poder de Dios para salvación, para todo aquel que cree."
      },
      {
        titulo: "Compromiso de lectura",
        tipo: "compromiso",
        texto: "Leer Romanos 1 completo antes de la próxima clase y anotar una pregunta que te surja del pasaje."
      }
    ]
  }
];

/* ========================================================================= */

const rejillaTemas = document.getElementById("rejilla-temas");
const vistaInicio = document.getElementById("vista-inicio");
const vistaTema = document.getElementById("vista-tema");
const tituloTema = document.getElementById("titulo-tema");
const listaClases = document.getElementById("lista-clases");

function pintarInicio(){
  rejillaTemas.innerHTML = temas.map((t, i) => `
    <div class="tarjeta-tema ${i % 2 === 0 ? "acento-rojo" : "acento-azul"}" tabindex="0" onclick="abrirTema('${t.id}')" onkeydown="if(event.key==='Enter')abrirTema('${t.id}')">
      <h3>${t.titulo}</h3>
      <span class="conteo">${t.clases.length} ${t.clases.length === 1 ? "clase" : "clases"}</span>
    </div>
  `).join("");
}

function abrirTema(id){
  const tema = temas.find(t => t.id === id);
  if(!tema) return;

  tituloTema.textContent = tema.titulo;

  listaClases.innerHTML = tema.clases.map((c, i) => `
    <div class="clase" id="clase-${i}">
      <button class="clase-cabecera" onclick="toggleClase(${i})">
        <span class="punto-tipo ${c.tipo}"></span>
        <span class="info-clase">
          <h3>${c.titulo}</h3>
          <span class="etiqueta-tipo ${c.tipo}">${etiquetas[c.tipo]}</span>
        </span>
        <span class="flecha">›</span>
      </button>
      <div class="clase-contenido">${c.texto}</div>
    </div>
  `).join("");

  vistaInicio.style.display = "none";
  vistaTema.style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});
  location.hash = id;
}

function volverAInicio(){
  vistaTema.style.display = "none";
  vistaInicio.style.display = "block";
  history.replaceState(null, "", location.pathname);
}

function toggleClase(i){
  document.getElementById("clase-" + i).classList.toggle("abierta");
}

pintarInicio();

if(location.hash){
  const id = location.hash.slice(1);
  if(temas.some(t => t.id === id)) abrirTema(id);
}
</script>

</body>
</html>
